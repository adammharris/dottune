<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tune</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="group">
        <button id="play" title="Play / stop (⌘↵)">▶ Play</button>
        <label><input id="loop" type="checkbox" checked /> Loop</label>
        <label title="A lane for each voice, with its own pitch range (L)"><input id="lanes" type="checkbox" checked /> Lanes</label>
        <span class="sep"></span>
        <input id="name" type="text" aria-label="File name" title="Name for Save and MIDI export" spellcheck="false" autocomplete="off" />
        <button id="open" title="Open a .tune file (⌘O), or drop one on the editor">Open</button>
        <input id="file" type="file" accept=".tune,.txt,text/plain" hidden />
        <button id="save" title="Download as a .tune file (⌘S)">Save</button>
        <button id="export" title="Download as a Standard MIDI File">⬇ MIDI</button>
        <button id="share" title="Copy a link that opens this tune">Share</button>
        <select id="examples" aria-label="Load example">
          <option value="">Load example…</option>
        </select>
      </div>
      <div class="group">
        <span id="scope" title="Select a note to edit the settings for its block"></span>
        <label>Key <select id="tonic"></select><select id="mode"></select></label>
        <label>Tempo <input id="tempo" type="number" min="20" max="320" step="1" /></label>
        <label>Time <select id="time"></select></label>
        <span id="octaves" title="Octave each part's first note starts in"></span>
      </div>
    </header>
    <main>
      <section id="editor">
        <pre id="gutter" aria-hidden="true"></pre>
        <div id="code">
          <pre id="highlight" aria-hidden="true"></pre>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
      </section>
      <section id="stage">
        <canvas id="roll" tabindex="0"></canvas>
        <p id="hint">
          Click a note to select it and play from there · <kbd>↑</kbd><kbd>↓</kbd> step · <kbd>⇧↑</kbd><kbd>⇧↓</kbd> octave · <kbd>1</kbd>–<kbd>7</kbd> degree ·
          <kbd>#</kbd> <kbd>b</kbd> · <kbd>.</kbd> rest · <kbd>-</kbd> hold · <kbd>S</kbd> split · drag a note's edges or <kbd>⇧←</kbd><kbd>⇧→</kbd> length · <kbd>←</kbd><kbd>→</kbd>
          <kbd>Tab</kbd> move · <kbd>⌘Z</kbd> undo · <kbd>Space</kbd> play · <kbd>⌘</kbd>-scroll zoom · <kbd>[</kbd><kbd>]</kbd> block · <kbd>0</kbd> fit · <kbd>L</kbd> lanes · <kbd>⇧</kbd>-click move playhead only
        </p>
      </section>
    </main>
    <footer id="status"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
